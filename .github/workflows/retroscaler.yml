name: retroscaler
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# One build per commit: a tag (release) run cancels a branch run of the same commit
concurrency:
  group: retroscaler-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.ref_type == 'tag' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Skip branch build if a release tag already builds this commit
      id: check
      shell: bash
      run: |
        if [ "${{ github.ref_type }}" = "branch" ] && git tag --points-at HEAD | grep -q '^v'; then
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        br_config: [n64, dreamcast, gamecube, 3do, parallel_1p_neogeo, parallel_2p, genesis, nes, snes, playstation, saturn]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Build with ESP-IDF
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        . $IDF_PATH/export.sh
        rm -fr build
        cp configs/hw1/${{ matrix.br_config }}_retroscaler sdkconfig
        idf.py reconfigure build
        mkdir dist
        cp build/BlueRetro_full.bin dist/BlueRetro_hw1_${{ matrix.br_config }}_retroscaler_full.bin
        cp build/BlueRetro.bin dist/BlueRetro_hw1_${{ matrix.br_config }}_retroscaler_app.bin
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hw1_${{ matrix.br_config }}_retroscaler
        path: dist/*
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Package zips
      shell: bash
      run: |
        mkdir pc ota
        for f in dist/*_full.bin; do cp "$f" "pc/$(basename "$f" _full.bin).bin"; done
        for f in dist/*_app.bin; do cp "$f" "ota/$(basename "$f" _app.bin).bin"; done
        printf '%s\n' \
          'Full flash images for flashing from a PC.' \
          'Flash the file for your adapter at address 0x0 (e.g. NodeMCU flasher default settings).' \
          'Saved settings, BT pairings & memory card data are kept.' > pc/FLASHING.txt
        printf '%s\n' \
          'App images for the BlueRetro web config firmware update (OTA over Bluetooth).' \
          'Select the file for your adapter in the web config OTA / firmware update page.' \
          'To flash from a PC instead, use these at address 0x10000, or use the pc-flashing zip at 0x0.' > ota/FLASHING.txt
        (cd pc && zip -q ../pc-flashing.zip *)
        (cd ota && zip -q ../web-ota-flashing.zip *)
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          pc-flashing.zip
          web-ota-flashing.zip
        body: |
          RetroScaler BlueRetro adapters firmware, 4 port & 1 port versions.

          | Adapter | File |
          |---|---|
          | N64 (4 port & 1 port) | `BlueRetro_hw1_n64_retroscaler.bin` |
          | Dreamcast (4 port & 1 port) | `BlueRetro_hw1_dreamcast_retroscaler.bin` |
          | GameCube (4 port & 1 port) | `BlueRetro_hw1_gamecube_retroscaler.bin` |
          | 3DO | `BlueRetro_hw1_3do_retroscaler.bin` |
          | Atari / SMS | `BlueRetro_hw1_parallel_2p_retroscaler.bin` |
          | SNK (Neo Geo) | `BlueRetro_hw1_parallel_1p_neogeo_retroscaler.bin` |
          | MD / Genesis | `BlueRetro_hw1_genesis_retroscaler.bin` |
          | NES | `BlueRetro_hw1_nes_retroscaler.bin` |
          | SNES | `BlueRetro_hw1_snes_retroscaler.bin` |
          | PS1 / PS2 | `BlueRetro_hw1_playstation_retroscaler.bin` |
          | Saturn | `BlueRetro_hw1_saturn_retroscaler.bin` |

          Both zips contain one `.bin` per adapter (same file names):
          * **`pc-flashing.zip`**: full flash images for flashing from a PC. Flash at **0x0** (e.g. NodeMCU flasher default settings). Same layout as the RetroScaler images.
          * **`web-ota-flashing.zip`**: app images for the BlueRetro web config firmware update (OTA over Bluetooth).

          Saved settings, BT pairings & memory card data are kept with either method.
          Default accessories are applied automatically on first boot (N64: Rumble Pak on all ports, Dreamcast: Jump Pack + VMU on port 1 & Jump Pack on ports 2-4, GameCube & PS1/PS2: rumble on all ports).
